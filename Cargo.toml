[package]
name = "advent-of-code-friend"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dotenv = "0.15.0"
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "rustls_backend", "model", "http"] }
strum = { version = "0.25.0", features = ["derive"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
serde = "1.0.192"
serde_json = "1.0.108"
reqwest = { version = "0.13.5", features = ["json"] }
chrono = "0.4.31"
log = "0.4.34"
fern = { version = "0.7.1", features = ["colored"] }
tl = "0.7.7"
